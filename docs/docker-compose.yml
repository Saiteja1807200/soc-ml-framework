version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: soc-ml-db
    environment:
      POSTGRES_USER: soc_admin
      POSTGRES_PASSWORD: soc_secure_password
      POSTGRES_DB: soc_ml_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: soc-ml-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://soc_admin:soc_secure_password@db:5432/soc_ml_db
      SECRET_KEY: supersecretkeyforSOCmlframework2026
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: soc-ml-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8000/api

volumes:
  pgdata:
